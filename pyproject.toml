[project]
name = "plug"
version = "0.1.0"
description = "PLUG: Protein Leakage-free evaluation for Unbiased Generators of function — leakage-free training sets (uniref90/pdb) + functional benchmarks"
requires-python = ">=3.10"
# core deps: enough to download, format, and build the training set
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "huggingface-hub>=0.20",
]

# torch is only needed to load the torch datasets (datasets.py): `uv sync --extra torch`
[project.optional-dependencies]
torch = ["torch>=2.0"]

# scripts repo, not an installable package — uv just manages the venv + deps
[tool.uv]
package = false

# mmseqs2 / foldseek are not pip-installable — set MMSEQS / FOLDSEEK to their paths, or `brew install mmseqs2 foldseek`
